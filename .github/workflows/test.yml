name: Test

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockstay
          POSTGRES_PASSWORD: stockstay
          POSTGRES_DB: stockstay_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U stockstay -d stockstay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://stockstay:stockstay@localhost:5433/stockstay_test
      DATABASE_URL: postgresql://stockstay:stockstay@localhost:5433/stockstay_test
      JWT_SECRET: ci-test-jwt-secret
      APP_ENV: local
      NODE_ENV: test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --include=dev
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test
