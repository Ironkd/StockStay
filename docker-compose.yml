# Local Postgres for Stock Stay development
# App DB: stockstay. Tests auto-create stockstay_test on the same instance (port 5433).
services:
  postgres:
    image: postgres:16-alpine
    container_name: stockstay-postgres
    restart: unless-stopped
# Host 5433 avoids clashing with other local Postgres on 5432
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: stockstay
      POSTGRES_PASSWORD: stockstay
      POSTGRES_DB: stockstay
    volumes:
      - stockstay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockstay -d stockstay"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  stockstay_pgdata:
